note: 'Reevo publishes no numeric rate limit for the public REST API or the MCP server.
  What it publishes instead is an organization-level QUOTA on "public requests" that
  is a precondition for creating an API key at all, plus a per-org monthly workflow-credit
  allowance on the pricing page. Neither is expressed as requests per unit time, neither
  has a published value, and neither is signalled at runtime: no rate-limit response
  headers are documented, and none were observed on live 401/422/404/405 responses
  from api.reevo.ai on 2026-08-13. An agent has no runtime signal telling it how close
  it is to the limit or when to retry.'
