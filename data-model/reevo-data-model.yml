extensibility:
  custom_fields:
    on:
    - account
    - contact
    - opportunity
    shape: 'dict[UUID | str, str | list[str]]'
    types:
    - text single line
    - text multi line
    - url
    - number
    - date
    - single-select
    - multi-select
    - boolean
    - amount/currency
    unique_capable:
    - text single line
    - text multi line
    - url
    - number
    - amount/currency
  custom_objects: true
  custom_relationships: true
render: null
gaps:
- No OpenAPI, so no machine-readable schema, no $ref graph and no response schemas.
- Search response shapes are published only as one example array for accounts; contacts,
  opportunities, users and mailboxes have no documented response body.
- Enum values for account.status are incomplete.
