- from: manual_activity
  to: sequence
  cardinality: belongs_to
  via: sequence_id
- from: sequence_enrollment
  to: contact
  cardinality: belongs_to
  via: contact_email
- from: sequence_enrollment
  to: sequence
  cardinality: belongs_to
  via: sequence_id
- from: sequence_enrollment
  to: mailbox
