name: Reevo
description: 'Reevo is an AI-native revenue platform ("revenue operating system") that
  consolidates the sales workflow into one system across four products: Find (lead
  sourcing, enrichment, routing and scoring), Engage (email sequences, dialing, inbox
  and meeting prep), Win (deal monitoring, smart task logging and coaching) and Foundation
  (a native CRM with an AI copilot, reporting, workflows and integrations). It helps
  GTM teams eliminate tool sprawl and automate repetitive sales work. Backed by Kleiner
  Perkins and Khosla Ventures. Reevo ships two callable surfaces: a permission-scoped
  public REST API at https://api.reevo.ai/api/v1/public authenticated with an x-api-key
  header (accounts, contacts, opportunities, tasks, manual activities, users, mailboxes
  and sequence enrollments), and a remote Model Context Protocol server at https://mcp.reevo.ai/mcp
  that exposes roughly 30 CRM tools over streamable-HTTP with OAuth 2.0 and granular
  read/create/update scopes. Neither surface publishes an OpenAPI or AsyncAPI definition
  — the contract is documented in prose in the Reevo Knowledge Base.'
