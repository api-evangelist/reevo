- aid: reevo-mcp-server
  name: Reevo MCP Server
  description: 'Reevo''s remote Model Context Protocol server. An MCP client POSTs
    to https://mcp.reevo.ai/mcp over MCP streamable-HTTP transport with OAuth 2.0 authorization
    (dynamic client registration, PKCE S256). It exposes roughly 30 tools across accounts,
    contacts, opportunities and pipelines, meetings, activity timeline, tasks, notes,
    email threads and mailboxes, sequences, custom objects and object schema, plus
    user search and whoami. Every call runs as the connected Reevo user and respects
    that user''s existing permissions; write tools act directly on the production workspace.
    Access is early-access and enabled per organization by Reevo.'
  humanURL: https://help.reevo.ai/AI-and-productivity/Reevo-MCP
