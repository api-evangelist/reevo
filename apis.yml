apis:
- aid: reevo-public-rest-api
  name: Reevo Public REST API
  description: 'Reevo''s permission-scoped public REST API. Endpoints cover account
    and contact upsert, accounts (create/update/get/search-by-domain), contacts (get/search),
    opportunities (create/update/get/search/shift-stage), tasks, manual activities,
    user search, mailbox search, sequence enrollment and combined account-and-contact
    retrieval. Authentication is an x-api-key header carrying a workspace API key whose
    per-resource read/write permissions are chosen at creation time. The service is
    a FastAPI/uvicorn application; no OpenAPI definition is published.'
  humanURL: https://help.reevo.ai/Data-management-and-migration/Integrations-With-Other-Tools
  baseURL: https://api.reevo.ai/api/v1/public
